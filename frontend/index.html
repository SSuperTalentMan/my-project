<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>商枢 CommercePivot · 经营分析控制台</title>
    <style>
      /* 首屏骨架：Vue 挂载前避免白屏闪烁 */
      body { margin: 0; background: #f5f8fc; }
      #boot {
        display: flex; align-items: center; justify-content: center;
        height: 100vh; gap: 10px; color: #7b8794;
        font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #boot i {
        width: 16px; height: 16px; border: 2px solid #d6e0ea;
        border-top-color: #1f4e79; border-radius: 50%;
        animation: spin .8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot"><i></i>正在加载控制台…</div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
